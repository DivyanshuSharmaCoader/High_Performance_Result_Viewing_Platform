# The deploy rehearsal (release.yml): compose.prod.yml on a CI runner, with object storage and mail that a
# real server would get from its providers (R2/S3, SES). Never used in production. Relative paths resolve
# from the first file's directory (the repository root).
services:
  s3:
    image: scorecode/seaweedfs:dev
    # Built by the rehearsal job before the deploy (the server bundle carries no build contexts).
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/rehearsal/s3.json", "-ip.bind=0.0.0.0"]
    volumes:
      - ./infra/ops/rehearsal/s3.json:/etc/rehearsal/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/status || exit 1"]
      interval: 3s
      retries: 40
  mailpit:
    image: axllent/mailpit:latest
  migrate:
    depends_on:
      s3: { condition: service_healthy }
