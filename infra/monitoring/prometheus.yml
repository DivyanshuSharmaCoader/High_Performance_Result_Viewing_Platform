# Prometheus for the container stack (P16.5, docs/14 §Q). `docker compose --profile monitoring up -d`.
# API and worker containers are found by DNS, so `--scale api=N` needs no change here.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api
    metrics_path: /metrics  # internal network only: the proxy never routes it
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8000
        refresh_interval: 15s
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
        refresh_interval: 15s
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: node  # the server itself: disk, memory, CPU
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: pushgateway  # batch jobs: backups
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
