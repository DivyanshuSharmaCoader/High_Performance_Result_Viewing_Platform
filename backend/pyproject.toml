[project]
name = "scorecode"
version = "0.1.0"
description = "ScoreCode — multi-tenant examination and result infrastructure (API + worker)"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "structlog>=24.4",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "cryptography>=43",
  "redis>=5.2",
  "boto3>=1.35",
  "python-multipart>=0.0.17",
  "openpyxl>=3.1.5",
  "charset-normalizer>=3.4",
  "jinja2>=3.1.4",
  "segno>=1.6",
  "prometheus-client>=0.21",
  "sentry-sdk[fastapi]>=2.18",
  "aiosmtplib>=3.0",
  "anyio>=4.6",
  "rapidfuzz>=3.10",
]

[project.optional-dependencies]
pdf = ["weasyprint>=63"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "hypothesis>=6.118",
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "bandit>=1.8",
  "pip-audit>=2.7",
  "boto3-stubs[s3]>=1.35",
  "types-openpyxl>=3.1",
]

[project.scripts]
scorecode = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PTH", "N", "C4", "PIE", "T20"]
ignore = [
  "S101",   # assert is fine in tests and for invariants
  "RUF012", # mutable class attrs are used for SQLAlchemy/pydantic config
  "B008",   # FastAPI Depends() in defaults is idiomatic
  "N818",   # domain error names read better without the Error suffix
  "E501",   # the formatter owns line length; long SQL/HTML/UI strings are kept intact
  "RUF001", "RUF002", "RUF003",  # typographic dashes/quotes are intentional in UI copy
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "S608", "PTH", "N802"]
"migrations/**" = ["S608"]
"app/{cli,seed}.py" = ["T201"]  # command-line output
"app/modules/platform/bootstrap.py" = ["T201"]
"scripts/**" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
ignore_missing_imports = true
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = ["app.modules.*.router", "app.modules.*.models"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "integration: needs PostgreSQL (and optionally Redis/MinIO/Mailpit)",
  "pdf: needs WeasyPrint system libraries (run in the Docker image)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core is a shared kernel and imports no business module"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules"]

[[tool.importlinter.contracts]]
name = "the grading engine is pure: no I/O, no framework, no other module (docs/08 §2, §7)"
type = "forbidden"
source_modules = ["app.modules.grading.engine"]
forbidden_modules = [
  "app.core",
  "app.web",
  "app.modules.academics",
  "app.modules.audit",
  "app.modules.branding",
  "app.modules.directory",
  "app.modules.entitlements",
  "app.modules.files",
  "app.modules.identity",
  "app.modules.ingestion",
  "app.modules.notifications",
  "app.modules.platform",
  "app.modules.tenancy",
  "sqlalchemy",
  "fastapi",
  "starlette",
  "asyncpg",
  "redis",
  "boto3",
  "httpx",
]
