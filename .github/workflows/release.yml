# Releases and deploys (P16.3, docs/14 §P).
#
#   git tag v1.2.3 && git push origin v1.2.3     → build, scan, push to GHCR, deploy to production after
#                                                   approval (GitHub Environment "production")
#   gh workflow run release.yml                   → the rehearsal only: nothing is pushed or deployed
#
# The rehearsal sets this runner up as the VPS is set up (infra/ops/server/bootstrap.sh on Ubuntu 24.04),
# then deploys through the same sudo-only path: first install, an upgrade with a backup, then a release
# that fails, which must roll back on its own.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]  # path filters don't apply to tag pushes
    branches: ["**"]
    paths:
      - "compose.prod.yml"
      - "infra/ops/**"
      - "infra/caddy/**"
      - "infra/backup/**"
      - "infra/bundle/**"
      - "infra/postgres/**"
      - "backend/Dockerfile"
      - "backend/uv.lock"
      - "frontend/Dockerfile"
      - "frontend/pnpm-lock.yaml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  rehearsal:
    name: Server rehearsal · bootstrap, sudo-only deploy user, settings, install, upgrade with backup, rollback
    runs-on: ubuntu-24.04  # the VPS's release
    timeout-minutes: 50
    env:
      V1: v0.0.1-rehearsal
      V2: v0.0.2-rehearsal
      VBAD: v0.0.3-rehearsal
      DOMAIN: scorecode.test
      # The rehearsal adds local object storage and mail, which a real server gets from its providers.
      COMPOSE_FILES: compose.prod.yml:infra/ops/rehearsal/compose.override.yml
    steps:
      - uses: actions/checkout@v7
      - name: Build the images of three releases (what a tag would push)
        run: |
          set -euo pipefail
          p=rehearsal/scorecode
          docker build -q --target runtime -t "$p-backend:$V1" backend
          docker build -q -f frontend/Dockerfile -t "$p-proxy:$V1" .
          docker build -q -t "$p-postgres:$V1" infra/postgres
          docker build -q -t "$p-backup:$V1" infra/backup
          docker build -q -f infra/bundle/Dockerfile -t "$p-bundle:$V1" .
          docker build -q -t scorecode/seaweedfs:dev infra/seaweedfs
          for n in backend proxy postgres backup bundle; do docker tag "$p-$n:$V1" "$p-$n:$V2"; done
          # A broken release: its migrate step fails, so the deploy must roll back.
          printf 'FROM %s\nENTRYPOINT ["sh", "-c", "echo broken release >&2; exit 1"]\n' "$p-backend:$V1" \
            | docker build -q -t "$p-backend:$VBAD" -
          for n in proxy postgres backup bundle; do docker tag "$p-$n:$V1" "$p-$n:$VBAD"; done
      - name: Server baseline (bootstrap.sh apply), as on the VPS
        run: |
          set -euo pipefail
          sudo bash infra/ops/server/bootstrap.sh apply | tee bootstrap.txt
          echo rehearsal | sudo tee /etc/scorecode/registry >/dev/null
          sudo ufw status | grep -q "Status: inactive"  # the firewall is written, not switched on (gate a)
      - name: The deploy user can run exactly two programs as root, and nothing else
        run: |
          set -euo pipefail
          sudo -u deploy sudo -n -l | tee sudo-l.txt
          grep -q /usr/local/sbin/scorecode-deploy sudo-l.txt && grep -q /usr/local/sbin/scorecode-ctl sudo-l.txt
          if sudo -u deploy sudo -n /usr/bin/id 2>/dev/null; then echo "deploy runs arbitrary commands as root"; exit 1; fi
          if sudo -u deploy docker ps 2>/dev/null; then echo "deploy reaches Docker directly"; exit 1; fi
          if sudo -u deploy sudo -n /usr/local/sbin/scorecode-deploy 'v1.0.0;id' 2>/dev/null; then echo "a bad version was accepted"; exit 1; fi
          if sudo -u deploy sudo -n /usr/local/sbin/scorecode-ctl logs 'api;id' 2>/dev/null; then echo "a bad service was accepted"; exit 1; fi
          sudo -u deploy sudo -n /usr/local/sbin/scorecode-ctl versions
      - name: Settings from the operator's values (render-env, through sudo)
        run: |
          set -euo pipefail
          # The rehearsal's own key pair: the private half stays on this runner, for the restore test.
          docker run --rm --entrypoint age-keygen "rehearsal/scorecode-backup:$V1" > age-key.txt 2>/dev/null
          recipient=$(grep -o 'age1[0-9a-z]*' age-key.txt)
          cat > values.txt <<EOF
          SCORECODE_DOMAIN=$DOMAIN
          FILES_S3_ENDPOINT=http://s3:8333
          FILES_S3_BUCKET=scorecode-files
          FILES_S3_ACCESS_KEY_ID=rehearsal
          FILES_S3_SECRET_ACCESS_KEY=rehearsal-object-storage-secret-0123456789
          FILES_S3_REGION=us-east-1
          BACKUP_S3_ENDPOINT=http://s3:8333
          BACKUP_S3_BUCKET=scorecode-backups
          BACKUP_S3_REGION=us-east-1
          BACKUP_S3_ACCESS_KEY_ID=rehearsal
          BACKUP_S3_SECRET_ACCESS_KEY=rehearsal-object-storage-secret-0123456789
          BACKUP_AGE_RECIPIENT=$recipient
          SMTP_HOST=mailpit
          SMTP_PORT=1025
          SMTP_USERNAME=rehearsal
          SMTP_PASSWORD=rehearsal-smtp-password
          MAIL_FROM=ScoreCode <results@$DOMAIN>
          ALERT_EMAIL_TO=ops@$DOMAIN
          PDF_PROCESSES=1
          EOF
          sudo -u deploy sudo -n /usr/local/sbin/scorecode-ctl render-env < values.txt | tee render.txt
          if grep -q rehearsal-object-storage-secret render.txt; then echo "render-env printed a value"; exit 1; fi
          # A value can't smuggle in a second setting, and unknown names are refused.
          if printf 'SCORECODE_DOMAIN=x\nSCORECODE_ENV=development\n' | sudo -u deploy sudo -n /usr/local/sbin/scorecode-ctl render-env 2>/dev/null; then
            echo "an unknown setting was accepted"; exit 1
          fi
          sudo sh -c "stat -c '%n %U:%G %a' /opt/scorecode/env/*.env /opt/scorecode/secrets/*" | tee perms.txt
          if grep -E '/env/[a-z]+\.env ' perms.txt | grep -v 'generated.env' | grep -v 'deploy:deploy 600'; then echo "env file with wrong owner or mode"; exit 1; fi
          if grep -E '/secrets/' perms.txt | grep -v 'root:nogroup 640'; then echo "secret file with wrong owner or mode"; exit 1; fi
          grep -q 'generated.env root:root 600' perms.txt
          # Run again: server-side secrets are generated once, never replaced.
          before=$(sudo sha256sum /opt/scorecode/env/generated.env)
          sudo -u deploy sudo -n /usr/local/sbin/scorecode-ctl render-env < values.txt >/dev/null
          test "$before" = "$(sudo sha256sum /opt/scorecode/env/generated.env)"
      - name: An origin certificate (self-signed here; Cloudflare's Origin CA on the VPS)
        run: |
          set -euo pipefail
          sudo openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=$DOMAIN" \
            -addext "subjectAltName=DNS:$DOMAIN,DNS:*.$DOMAIN" \
            -keyout /opt/scorecode/certs/origin-key.pem -out /opt/scorecode/certs/origin.pem 2>/dev/null
          sudo cp /opt/scorecode/certs/origin.pem /opt/scorecode/certs/origin-ca.pem
          sudo chmod 600 /opt/scorecode/certs/origin-key.pem
      - name: First install (v0.0.1) through scorecode-deploy
        run: |
          set -euo pipefail
          sudo SKIP_PULL=1 SKIP_BACKUP=1 COMPOSE_FILES="$COMPOSE_FILES" /usr/local/sbin/scorecode-deploy "$V1"
          test "$(cat /opt/scorecode/.deployed-version)" = "$V1"
          # ...and production really refuses demo data.
          cd /opt/scorecode
          if sudo SCORECODE_VERSION="$V1" REGISTRY=rehearsal docker compose -f compose.prod.yml -f infra/ops/rehearsal/compose.override.yml \
            --env-file env/deploy.env exec -T api scorecode seed --students 5; then echo "seeded production"; exit 1; fi
      - name: The edge allows images from where signed links point (logo regression, 2026-10-16)
        run: |
          set -euo pipefail
          csp=$(curl -sS --max-time 15 --connect-to ::127.0.0.1:443 --cacert /opt/scorecode/certs/origin-ca.pem \
            -o /dev/null -D - "https://any-institution.$DOMAIN/login" | tr -d '\r' | grep -i '^content-security-policy:')
          echo "$csp" | tr ';' '\n' | grep -i 'img-src'
          # The rehearsal's object store endpoint (FILES_S3_ENDPOINT) is http://s3:8333.
          echo "$csp" | grep -qE "img-src [^;]*http://s3:8333" || { echo "img-src doesn't allow the object store"; exit 1; }
      - name: Upgrade (v0.0.2), with an encrypted backup of the database and the files first
        run: |
          set -euo pipefail
          cd /opt/scorecode
          sudo SCORECODE_VERSION="$V1" REGISTRY=rehearsal docker compose -f compose.prod.yml -f infra/ops/rehearsal/compose.override.yml \
            --env-file env/deploy.env run --rm --entrypoint aws backup --endpoint-url http://s3:8333 s3 mb s3://scorecode-backups
          sudo SKIP_PULL=1 COMPOSE_FILES="$COMPOSE_FILES" /usr/local/sbin/scorecode-deploy "$V2"
          test "$(cat .deployed-version)" = "$V2"
          grep -q '"backup":"s3://scorecode-backups/prod/db/' deploy.log
      - name: A failed release rolls back on its own
        run: |
          set -euo pipefail
          cd /opt/scorecode
          if sudo SKIP_PULL=1 SKIP_BACKUP=1 COMPOSE_FILES="$COMPOSE_FILES" /usr/local/sbin/scorecode-deploy "$VBAD"; then
            echo "the broken release was reported as deployed"; exit 1
          fi
          grep -q "rolled back to $V2" deploy.log
          test "$(cat .deployed-version)" = "$V2"
          SMOKE_BASE_DOMAIN="$DOMAIN" SMOKE_SCHEME=https SMOKE_PORT=443 SMOKE_CONNECT_TO=127.0.0.1:443 \
            SMOKE_CACERT=/opt/scorecode/certs/origin-ca.pem SMOKE_TENANT="" infra/ops/smoke.sh
      - name: Operations as the deploy user (scorecode-ctl)
        run: |
          set -euo pipefail
          sudo -u deploy sudo -n /usr/local/sbin/scorecode-ctl status
          sudo -u deploy sudo -n /usr/local/sbin/scorecode-ctl versions
          sudo -u deploy sudo -n /usr/local/sbin/scorecode-ctl jobs stats
          sudo -u deploy sudo -n /usr/local/sbin/scorecode-ctl logs api 5 >/dev/null
          # The production checks, in the production image (not the test environment's dependencies).
          sudo -u deploy sudo -n /usr/local/sbin/scorecode-ctl storage-test
          echo "ops@$DOMAIN" | sudo -u deploy sudo -n /usr/local/sbin/scorecode-ctl email-test
          sudo -u deploy sudo -n /usr/local/sbin/scorecode-ctl archive-logs
          sudo test -f "/var/log/scorecode/$(date -u -d yesterday +%F).log.gz"
          systemctl is-enabled scorecode-logs.timer
          test -f /etc/systemd/timesyncd.conf.d/scorecode.conf
      - name: A real restore of the newest backup (scorecode-ctl restore-test), decrypted off the server
        run: |
          set -euo pipefail
          cd /opt/scorecode
          dcr() { sudo SCORECODE_VERSION="$V2" REGISTRY=rehearsal docker compose -f compose.prod.yml \
            -f infra/ops/rehearsal/compose.override.yml --env-file env/deploy.env "$@"; }
          newest=$(dcr run --rm -T --entrypoint aws backup --endpoint-url http://s3:8333 s3 ls --recursive \
            s3://scorecode-backups/prod/db/ | sort | tail -1 | awk '{print $4}')
          test -n "$newest"
          # As on the owner's Mac (infra/ops/restore-test.py): fetch, decrypt here, stream to the server.
          dcr run --rm -T --entrypoint aws backup --endpoint-url http://s3:8333 s3 cp "s3://scorecode-backups/$newest" - \
            | docker run --rm -i -v "$GITHUB_WORKSPACE/age-key.txt:/k:ro" --entrypoint age "rehearsal/scorecode-backup:$V1" -d -i /k \
            | sudo -u deploy sudo -n /usr/local/sbin/scorecode-ctl restore-test | tee "$GITHUB_WORKSPACE/restore-test.txt"
          grep -q '"restored":"/restore/db.dump"' "$GITHUB_WORKSPACE/restore-test.txt"
          grep -q 'lines identical to the live database' "$GITHUB_WORKSPACE/restore-test.txt"
          # Only rows written since the backup may differ (the email test above, jobs, sessions); anything
          # else (results, schema, policies, grants) must be identical.
          if grep -E '^(live|restored):' "$GITHUB_WORKSPACE/restore-test.txt" \
              | grep -vE ' rows (mail_sends|jobs|sessions|platform_sessions|idempotency_keys) [0-9]+$'; then
            echo "the restore differs from the live database beyond rows written since the backup"; exit 1
          fi
          # Nothing is left behind: no scratch container, no plaintext.
          test -z "$(sudo docker ps -aq --filter name=scorecode-restore-test)"
          test -z "$(sudo find /opt/scorecode -maxdepth 1 -name 'restore-test.*')"
      - name: Hardening as deployed
        run: |
          set -euo pipefail
          for c in $(docker ps --filter label=com.docker.compose.project=scorecode --format '{{.Names}}'); do
            docker inspect -f '{{.Name}} user={{.Config.User}} readonly={{.HostConfig.ReadonlyRootfs}} capdrop={{.HostConfig.CapDrop}} nonewpriv={{.HostConfig.SecurityOpt}}' "$c"
          done | tee hardening.txt
          for svc in api worker backup redis; do
            grep -E "scorecode-$svc-1 " hardening.txt | grep -q "readonly=true" || { echo "$svc is not read-only"; exit 1; }
            grep -E "scorecode-$svc-1 " hardening.txt | grep -qv "user= " || { echo "$svc runs as root"; exit 1; }
          done
      - name: Rehearsal log
        if: always()
        run: |
          { echo "### Server rehearsal"; echo '```'; sudo cat /opt/scorecode/deploy.log 2>/dev/null | grep -v '^{' | tail -40; echo '```'
            echo '```'; cat sudo-l.txt perms.txt hardening.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Logs on failure
        if: failure()
        run: |
          cd /opt/scorecode 2>/dev/null || exit 0
          sudo SCORECODE_VERSION="$(cat .deployed-version 2>/dev/null || echo "$V1")" REGISTRY=rehearsal docker compose \
            -f compose.prod.yml -f infra/ops/rehearsal/compose.override.yml --env-file env/deploy.env \
            logs --tail 80 migrate api worker proxy backup || true

  # The same scan as a release, on branches: a vulnerable base image is found before a tag, not by it.
  scan:
    name: Build and scan images (branches; nothing is pushed)
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          set -euo pipefail
          docker build -q --target runtime -t scan/backend backend
          docker build -q -f frontend/Dockerfile -t scan/proxy .
          docker build -q -t scan/postgres infra/postgres
          docker build -q -t scan/backup infra/backup
      - name: Trivy · backend
        uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "scan/backend", severity: CRITICAL, ignore-unfixed: true, exit-code: "1" }
      - name: Trivy · proxy
        uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "scan/proxy", severity: CRITICAL, ignore-unfixed: true, exit-code: "1" }
      - name: Trivy · postgres
        uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "scan/postgres", severity: CRITICAL, ignore-unfixed: true, exit-code: "1" }
      - name: Trivy · backup
        uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "scan/backup", severity: CRITICAL, ignore-unfixed: true, exit-code: "1" }

  images:
    name: Build, scan and push images (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: rehearsal
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        id: build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          prefix="ghcr.io/$owner/scorecode"
          docker build -q --target runtime -t "$prefix-backend:$VERSION" backend
          docker build -q -f frontend/Dockerfile -t "$prefix-proxy:$VERSION" .
          docker build -q -t "$prefix-postgres:$VERSION" infra/postgres
          docker build -q -t "$prefix-backup:$VERSION" infra/backup
          docker build -q -f infra/bundle/Dockerfile -t "$prefix-bundle:$VERSION" .
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
      - name: Trivy · backend (fixable critical vulnerabilities stop the release)
        uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "${{ steps.build.outputs.prefix }}-backend:${{ github.ref_name }}", severity: CRITICAL, ignore-unfixed: true, exit-code: "1" }
      - name: Trivy · proxy
        uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "${{ steps.build.outputs.prefix }}-proxy:${{ github.ref_name }}", severity: CRITICAL, ignore-unfixed: true, exit-code: "1" }
      - name: Trivy · postgres
        uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "${{ steps.build.outputs.prefix }}-postgres:${{ github.ref_name }}", severity: CRITICAL, ignore-unfixed: true, exit-code: "1" }
      - name: Trivy · backup
        uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "${{ steps.build.outputs.prefix }}-backup:${{ github.ref_name }}", severity: CRITICAL, ignore-unfixed: true, exit-code: "1" }
      - name: Push
        run: |
          for name in backend proxy postgres backup bundle; do
            docker push "${{ steps.build.outputs.prefix }}-$name:${{ github.ref_name }}"
          done

  deploy:
    name: Deploy to production (after approval)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: images
    runs-on: ubuntu-24.04
    environment: production  # required reviewers are configured in the repository settings
    steps:
      - uses: actions/checkout@v7
      - name: Deploy over SSH, with the server's deploy script
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$HOST" ]; then
            echo "::notice::No production server is configured (DEPLOY_HOST); images are pushed, nothing deployed."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The deploy user may only run the root-owned wrapper, which takes the compose file and scripts
          # from this version's bundle image, never from us (infra/ops/server/scorecode-deploy).
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER_@$HOST" \
            sudo /usr/local/sbin/scorecode-deploy "$VERSION"
      - name: Smoke test through Cloudflare, with real certificates
        env:
          DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
          SMOKE_TENANT: ${{ vars.SMOKE_TENANT }}
        run: |
          if [ -z "$DOMAIN" ]; then echo "::notice::PRODUCTION_DOMAIN not set"; exit 0; fi
          # No school is assumed to exist in production (smoke.sh's default, thapar, is the demo's);
          # SMOKE_TENANT (a repository variable) names one to check as well.
          SMOKE_BASE_DOMAIN="$DOMAIN" SMOKE_SCHEME=https SMOKE_TENANT="${SMOKE_TENANT:-}" infra/ops/smoke.sh
