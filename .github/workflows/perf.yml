# Load tests on a GitHub-hosted runner (Phase 14, docs/11 §4). Started by hand:
#
#   gh workflow run perf.yml -f runs="A:preauth:3 B:preauth:3 A:cold:1 B:cold:1" -f api_replicas=1
#
# The runner hosts the stack and the load generator together (co-located: results are pessimistic), on
# the same documented hardware each time, so runs are comparable and don't depend on a laptop's power
# state. Every run's k6 summary, raw data and docker stats, the top queries from pg_stat_statements,
# EXPLAIN plans of the read path and a py-spy profile of the API are uploaded as an artifact.
name: Performance

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Space-separated scenario:variant:repetitions (scenarios A, B, smoke; variants preauth, cold)"
        default: "A:preauth:3 B:preauth:3 A:cold:1 B:cold:1"
      api_replicas:
        description: "API containers behind Caddy (P14.4: 1 vs 2)"
        default: "1"
      api_workers:
        description: "Uvicorn worker processes per API container"
        default: "2"
      profile:
        description: "Record a py-spy profile of the API during the first B run"
        type: boolean
        default: true
      chaos:
        description: "Failure to inject (P14.5): none, redis, postgres (during the first B run) or worker (while marksheets render)"
        default: "none"

# No concurrency group: each run gets its own runner VM, so runs don't disturb each other (and a group
# would cancel queued runs).

permissions:
  contents: read

jobs:
  k6:
    name: k6 · ${{ inputs.runs }} · ${{ inputs.api_replicas }}×${{ inputs.api_workers }} API
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      API_WORKERS: ${{ inputs.api_workers }}
      RUNS: ${{ inputs.runs }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with: { enable-cache: true, cache-dependency-glob: backend/uv.lock }
      - name: Machine
        run: |
          {
            echo "### Machine"
            echo '```'
            echo "commit $(git rev-parse --short HEAD)"; nproc; free -m | head -2; lscpu | grep -E 'Model name|^CPU\(s\)|Thread'
            docker version --format 'docker {{.Server.Version}}'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" > /tmp/machine.txt
      - name: Start the stack
        run: |
          docker compose --profile app up -d --build --wait --scale api=${{ inputs.api_replicas }}
          docker compose ps
      - name: Synthetic result-day data (8,000 students, published)
        working-directory: backend
        run: |
          uv sync --frozen
          uv run python scripts/loadtest_data.py --students 8000 --sessions 1000 --out ../benchmarks/data
      - name: Let publication's background work finish (marksheets, notifications)
        run: |
          set -euo pipefail
          mkdir -p benchmarks/results/runs && chmod 777 benchmarks/results/runs
          q() { docker compose exec -T postgres psql -U postgres -d scorecode -Atc "$1"; }
          started=$(date +%s)
          if [ "${{ inputs.chaos }}" = worker ]; then
            sleep 30
            echo "chaos: kill -9 the worker at $(date -u +%T) (epoch $(date +%s))" | tee benchmarks/results/runs/chaos.txt
            docker kill -s KILL scorecode-worker-1
            sleep 15
            docker compose --profile app start worker
          fi
          until [ "$(q "SELECT count(*) FROM jobs WHERE status IN ('queued','running')")" = 0 ]; do
            [ $(( $(date +%s) - started )) -gt 2700 ] && { echo "background work still running after 45 min"; break; }
            sleep 10
          done
          {
            echo "background work after publishing 8,000 results: $(( $(date +%s) - started )) s (measured from data load end)"
            echo "pdf processes per worker: $(docker compose exec -T worker printenv SCORECODE_PDF_PROCESSES || echo default)"
            q "SELECT status, count(*) FROM marksheet_documents GROUP BY status"
            q "SELECT 'marksheet render span (s): ' || round(extract(epoch FROM max(rendered_at) - min(created_at))) FROM marksheet_documents"
            q "SELECT 'notifications: ' || count(*) FROM notifications"
            q "SELECT kind, status, count(*) FROM jobs GROUP BY kind, status ORDER BY kind"
            # Exactly-once checks (after a worker kill especially): one PDF file per marksheet, one notice each.
            q "SELECT 'marksheet files: ' || count(*) || ' for ' || (SELECT count(*) FROM marksheet_documents WHERE status = 'rendered') || ' rendered marksheets' FROM files WHERE kind = 'marksheet'"
            q "SELECT 'duplicate notifications: ' || count(*) FROM (SELECT user_id, dedupe_key FROM notifications GROUP BY 1, 2 HAVING count(*) > 1) d"
          } | tee benchmarks/results/runs/background.txt
      - name: Reset query statistics
        run: |
          docker compose exec -T postgres psql -U postgres -d scorecode -c "SELECT pg_stat_statements_reset()"
          mkdir -p benchmarks/results/runs && chmod 777 benchmarks/results/runs  # k6 and py-spy write as other users
      - name: k6 runs
        run: |
          set -euo pipefail
          first_b=1
          first_chaos=1
          for spec in $RUNS; do
            IFS=: read -r scenario variant times <<< "$spec"
            for i in $(seq 1 "$times"); do
              if [ "${{ inputs.profile }}" = "true" ] && [ "$scenario" = B ] && [ "$first_b" = 1 ]; then
                first_b=0
                # Sample the API's processes for 2 minutes during the hold phase.
                ( sleep 90; docker run --rm --pid=container:scorecode-api-1 --cap-add SYS_PTRACE \
                    -v "$PWD/benchmarks/results/runs:/out" python:3.12-slim sh -c \
                    "pip install -q py-spy && py-spy record --pid 1 --subprocesses --duration 120 \
                     --format raw -o /out/py-spy-$scenario-$variant-$i.txt --nonblocking" ) &
              fi
              if [ "$scenario" = B ] && [ "$first_chaos" = 1 ] && [ "${{ inputs.chaos }}" != none ] && [ "${{ inputs.chaos }}" != worker ]; then
                first_chaos=0
                ( sleep 150
                  echo "chaos: ${{ inputs.chaos }} at $(date -u +%T) (epoch $(date +%s)) during $scenario-$variant-$i" | tee -a benchmarks/results/runs/chaos.txt
                  if [ "${{ inputs.chaos }}" = redis ]; then
                    docker compose stop redis; sleep 60; docker compose start redis
                  else
                    docker compose restart postgres
                  fi
                  echo "chaos: recovered action done at $(date -u +%T) (epoch $(date +%s))" | tee -a benchmarks/results/runs/chaos.txt ) &
              fi
              benchmarks/k6/run.sh "$scenario" "$variant" "$i"
              sleep 20
            done
          done
          wait
      - name: Hot queries and plans
        if: always()
        run: |
          cp /tmp/machine.txt benchmarks/results/runs/machine.txt || true
          docker compose exec -T postgres psql -U postgres -d scorecode -c \
            "SELECT calls, round(total_exec_time::numeric, 1) AS total_ms, round(mean_exec_time::numeric, 3) AS mean_ms,
                    rows, left(regexp_replace(query, '\s+', ' ', 'g'), 160) AS query
               FROM pg_stat_statements WHERE dbid = (SELECT oid FROM pg_database WHERE datname = 'scorecode')
              ORDER BY total_exec_time DESC LIMIT 20" > benchmarks/results/runs/pg_stat_statements.txt
          (cd backend && uv run python scripts/explain_hot_queries.py) > benchmarks/results/runs/explain.txt
          docker compose --profile app logs --no-log-prefix api 2>/dev/null \
            | python3 benchmarks/k6/timeline.py --around "$(grep -o 'epoch [0-9]*' benchmarks/results/runs/chaos.txt 2>/dev/null | head -1 | cut -d' ' -f2)" \
            > benchmarks/results/runs/timeline.txt || true
      - name: Summary
        if: always()
        run: |
          {
            echo "### Runs"
            for f in benchmarks/results/runs/*-*-*.txt; do
              case "$f" in *py-spy*) continue;; esac
              echo '```'; cat "$f"; echo '```'
            done
            echo "### Top queries by total time"
            echo '```'; head -30 benchmarks/results/runs/pg_stat_statements.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-${{ github.run_id }}
          path: benchmarks/results/runs
          retention-days: 30
      - name: Stack logs on failure
        if: failure()
        run: docker compose --profile app logs --tail 200 api worker proxy
