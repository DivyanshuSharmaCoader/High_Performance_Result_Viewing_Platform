# ScoreCode CI (docs/14 §P). Every job must pass before a checkpoint is ticked in docs/CHECKLIST.md.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"
  FORCE_COLOR: "1"

jobs:
  backend-lint:
    name: Backend · lint & types
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with: { enable-cache: true, cache-dependency-glob: backend/uv.lock }
      - run: uv sync --frozen
      - name: ruff format
        run: uv run ruff format --check app tests migrations
      - name: ruff lint
        run: uv run ruff check app tests migrations
      - name: mypy (strict)
        run: uv run mypy app
      - name: module boundaries (import-linter)
        run: uv run lint-imports
      - name: OpenAPI contract is committed and current
        run: |
          uv run python -m app.openapi > /tmp/openapi.json
          diff -u openapi.json /tmp/openapi.json || (echo "backend/openapi.json is stale: run 'make openapi'"; exit 1)
      - name: no tenant slugs or plan codes in code (docs/06 §5, docs/12)
        run: |
          set -e
          if grep -rnE "slug *== *[\"'](thapar|demoschool|democoaching)" app; then echo "tenant-specific code found"; exit 1; fi
          if grep -rnE "plan(_code)? *== *[\"'](free|starter|growth|pro|enterprise)[\"']" app --include=*.py | grep -v "app/modules/entitlements/"; then
            echo "plan-code comparison outside the entitlements module"; exit 1
          fi

  backend-unit:
    name: Backend · unit tests
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with: { enable-cache: true, cache-dependency-glob: backend/uv.lock }
      - run: uv sync --frozen
      - run: uv run pytest tests/unit -q
      - name: Grading engine branch coverage ≥ 90% (P7.1)
        run: >-
          uv run pytest tests/unit/test_grading_engine.py tests/unit/test_grading_properties.py
          tests/unit/test_grading_golden.py -q --cov=app.modules.grading.engine --cov-branch
          --cov-report=term --cov-fail-under=90

  backend-integration:
    name: Backend · integration, RLS & isolation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with: { enable-cache: true, cache-dependency-glob: backend/uv.lock }
      - name: Start PostgreSQL, Redis, S3 (SeaweedFS), Mailpit
        run: docker compose up -d --build --wait postgres redis s3 mailpit
      - name: WeasyPrint system libraries and fonts (marksheet PDFs)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 fontconfig fonts-dejavu-core fonts-noto-core
      - run: uv sync --frozen --extra pdf
        working-directory: backend
      - name: pytest (all suites) with coverage
        working-directory: backend
        env:
          SCORECODE_TEST_REQUIRE_SERVICES: "1"  # never silently skip integration tests in CI
          SCORECODE_TEST_REQUIRE_PDF: "1"  # nor the marksheet PDF tests
        run: uv run pytest -q --cov=app --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Marksheet render time per PDF (informational, P11.2)
        working-directory: backend
        continue-on-error: true
        run: uv run python scripts/measure_marksheets.py --count 100 --papers 6 --processes 4
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail 200

  frontend:
    name: Frontend · lint, types, tests, build
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - name: Generated API types match backend/openapi.json
        run: pnpm --filter @scorecode/api-client generate && git diff --exit-code -- packages/api-client/src/schema.d.ts
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Bundle budget (student first load < 150 kB gz, enforced — P10.5)
        run: pnpm budget

  e2e:
    name: End-to-end (Playwright, full stack)
    runs-on: ubuntu-24.04
    needs: [backend-unit, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Start the full stack (migrate, api, worker, Caddy)
        run: docker compose --profile app up -d --build --wait
      - name: Seed demo tenants
        run: docker compose --profile app exec -T api scorecode seed
      - uses: pnpm/action-setup@v6
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - name: Install Playwright
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: frontend
        env: { CI: "1" }
        run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with: { name: playwright-report, path: frontend/playwright-report, retention-days: 7 }
      - name: Stack logs on failure
        if: failure()
        run: docker compose --profile app logs --tail 300 api worker proxy

  security:
    name: Security scans
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v10.2.0
        with: { enable-cache: true, cache-dependency-glob: backend/uv.lock }
      - name: pip-audit (runtime dependencies)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project --format requirements-txt -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --strict
      - name: bandit (SAST, medium+)
        working-directory: backend
        run: uvx bandit -q -r app -ll
      - name: semgrep (SAST, OWASP Top 10 and Python rules; errors fail)
        run: uvx semgrep scan --metrics=off --config p/owasp-top-ten --config p/python --severity ERROR --error backend/app infra/ops
      - name: shellcheck (operations scripts; errors fail)
        run: |
          shellcheck --version | head -2
          shellcheck -S error infra/ops/*.sh infra/ops/server/*.sh infra/ops/server/scorecode-deploy \
            infra/ops/server/scorecode-ctl infra/backup/*.sh benchmarks/k6/*.sh
      - uses: pnpm/action-setup@v6
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - name: pnpm audit (high+)
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm audit --audit-level high

  docker:
    name: Docker image build & scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend runtime image
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: runtime
          load: true
          tags: scorecode/backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image runs and refuses unsafe production config
        run: |
          docker run --rm scorecode/backend:ci scorecode --help >/dev/null
          if docker run --rm -e SCORECODE_ENV=production scorecode/backend:ci python -c "from app.core.config import Settings; Settings()"; then
            echo "production settings with dev defaults must fail"; exit 1
          fi
      - name: Trivy (fixable critical vulnerabilities fail the build)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scorecode/backend:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
