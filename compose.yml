# ScoreCode local stack (docs/14 N1).
#
#   make up        → infrastructure only (postgres, redis, s3, mailpit) for running api/worker/vite on the host
#   make stack     → everything in containers, served by Caddy on http://*.localhost:8080
#
# Hosts: http://thapar.localhost:8080 · http://admin.localhost:8080 · http://verify.localhost:8080 · http://localhost:8080
name: scorecode

x-backend-env: &backend-env
  SCORECODE_ENV: development
  SCORECODE_BASE_DOMAIN: localhost
  SCORECODE_PUBLIC_PORT: "8080"
  SCORECODE_DATABASE_URL_APP: postgresql+asyncpg://scorecode_app:app-dev-pw@postgres:5432/scorecode
  SCORECODE_DATABASE_URL_PLATFORM: postgresql+asyncpg://scorecode_platform:platform-dev-pw@postgres:5432/scorecode
  SCORECODE_DATABASE_URL_MIGRATOR: postgresql+asyncpg://scorecode_migrator:migrator-dev-pw@postgres:5432/scorecode
  SCORECODE_REDIS_URL: redis://redis:6379/0
  SCORECODE_S3_ENDPOINT_URL: http://s3:8333
  SCORECODE_S3_PUBLIC_ENDPOINT_URL: http://files.localhost:8080
  SCORECODE_S3_BUCKET: scorecode-dev
  SCORECODE_S3_ACCESS_KEY: scorecode
  SCORECODE_S3_SECRET_KEY: scorecode-dev-secret
  SCORECODE_SMTP_HOST: mailpit
  SCORECODE_SMTP_PORT: "1025"
  SCORECODE_LOG_JSON: "true"
  SCORECODE_TRUST_PROXY_HEADERS: "true"
  SCORECODE_STUDENT_READ_CACHE: ${STUDENT_READ_CACHE:-true}  # perf.yml compare=cache turns it off
  # Local stack only: relaxed abuse limits so repeated end-to-end runs from one IP aren't throttled.
  SCORECODE_RATE_SIGNUP_IP_PER_HOUR: "200"
  SCORECODE_RATE_ACTIVATION_IP_PER_HOUR: "2000"

services:
  postgres:
    build: { context: ./infra/postgres }
    image: scorecode/postgres:16
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-dev-pw
      SCORECODE_MIGRATOR_PASSWORD: migrator-dev-pw
      SCORECODE_APP_PASSWORD: app-dev-pw
      SCORECODE_PLATFORM_PASSWORD: platform-dev-pw
      SCORECODE_BACKUP_PASSWORD: backup-dev-pw    # optional roles (infra/postgres/init/01-roles.sh)
      SCORECODE_MONITOR_PASSWORD: monitor-dev-pw
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scorecode"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  s3:
    # S3-compatible object storage for development (SeaweedFS; production uses S3/R2 — same API).
    build: { context: ./infra/seaweedfs }
    image: scorecode/seaweedfs:dev
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json",
              "-master.volumeSizeLimitMB=128", "-volume.max=50", "-ip.bind=0.0.0.0"]
    ports: ["127.0.0.1:59000:8333"]
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/status || exit 1"]
      interval: 3s
      retries: 40

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:58025:8025", "127.0.0.1:51025:1025"]

  # ---- development proxy (profile "dev"): routes *.localhost:8080 to host-run API and Vite servers --
  devproxy:
    profiles: [dev]
    build: { context: ./infra/caddy, dockerfile: Dockerfile.dev }
    ports: ["127.0.0.1:8080:8080"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  # ---- application (profile "app") -------------------------------------------------------------
  migrate:
    profiles: [app]
    build: { context: ./backend, target: runtime }
    environment: *backend-env
    command: ["scorecode", "migrate"]
    depends_on: { postgres: { condition: service_healthy } }

  api:
    profiles: [app]
    build: { context: ./backend, target: runtime }
    environment: *backend-env
    command: ["scorecode", "api", "--host", "0.0.0.0", "--port", "8000", "--workers", "${API_WORKERS:-2}"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz', timeout=2).status==200 else 1)"]
      interval: 5s
      retries: 20

  worker:
    profiles: [app]
    build: { context: ./backend, target: runtime }
    environment: *backend-env
    command: ["scorecode", "worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  proxy:
    profiles: [app]
    build: { context: ., dockerfile: frontend/Dockerfile }
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header 'Host: localhost:8080' http://127.0.0.1:8080/ || exit 1"]
      interval: 3s
      retries: 20
    environment:
      BASE_DOMAIN: localhost
      FILES_ORIGIN: http://files.localhost:8080
    depends_on:
      api: { condition: service_healthy }

  # ---- operations (profile "ops"): nightly encrypted backups (P16.4) ------------------------------
  backup:
    profiles: [ops]
    build: { context: ./infra/backup }
    image: scorecode/backup:dev
    environment:
      PGHOST: postgres
      PGDATABASE: scorecode
      PGUSER: scorecode_backup
      PGPASSWORD: backup-dev-pw
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}  # age public key (age-keygen -y key.txt)
      BACKUP_S3_URI: s3://scorecode-backups/dev
      BACKUP_S3_ENDPOINT: http://s3:8333  # production: a different provider or region
      BACKUP_FILES_S3_URI: s3://scorecode-dev
      AWS_ACCESS_KEY_ID: scorecode
      AWS_SECRET_ACCESS_KEY: scorecode-dev-secret
      AWS_DEFAULT_REGION: us-east-1
      PUSHGATEWAY_URL: http://pushgateway:9091
    depends_on:
      postgres: { condition: service_healthy }

  # ---- monitoring (profile "monitoring"): Prometheus, Alertmanager → Mailpit, Grafana (P16.5) -------
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.4.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:59090:9090"]

  alertmanager:
    profiles: [monitoring]
    image: prom/alertmanager:v0.28.1
    volumes:
      - ./infra/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["127.0.0.1:59093:9093"]

  pushgateway:
    profiles: [monitoring]
    image: prom/pushgateway:v1.11.1

  node-exporter:  # the host's disk and memory (ScoreCodeDiskFillingUp, ScoreCodeMemoryLow)
    profiles: [monitoring]
    image: prom/node-exporter:v1.9.1
    command: ["--path.rootfs=/host"]
    pid: host
    read_only: true
    volumes: ["/:/host:ro,rslave"]
    restart: unless-stopped
  postgres-exporter:
    profiles: [monitoring]
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://scorecode_monitor:monitor-dev-pw@postgres:5432/scorecode?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  grafana:
    profiles: [monitoring]
    image: grafana/grafana-oss:12.0.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: grafana-dev-pw
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:53000:3000"]

volumes:
  pgdata:
  s3data:
  promdata:
