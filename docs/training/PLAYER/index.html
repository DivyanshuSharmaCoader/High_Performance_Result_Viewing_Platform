<script>
const MODULES = [{"id": "m01-orientation", "title": {"en": "Module 1 · Welcome to ScoreCode", "hi": "भाग 1 · ScoreCode में आपका स्वागत है"}, "role": "Everyone", "plan": "Every plan", "minutes": "1:14", "vtt": {"en": "WEBVTT\n\n00:00:00.400 --> 00:00:09.708\nWelcome. ScoreCode is where a school keeps its students, enters marks, and publishes results that students can see and anyone can verify.\n\n00:00:13.003 --> 00:00:20.686\nIn this series we follow a made-up school, Sunrise Public School, through Periodic Test 1 for Class 10, Section A.\n\n00:00:22.783 --> 00:00:29.607\nMrs. Sunita Sharma, the principal, signs in. As the owner, she sees the dashboard first.\n\n00:00:31.454 --> 00:00:44.802\nThere are four kinds of account. The Owner, here the principal. Administrators, such as the exam coordinator. Faculty, the teachers, like Mr. Amit Kumar on the Staff page. And Students.\n\n00:00:46.169 --> 00:00:53.132\nThere is no separate role for parents, principals or coordinators. Give each person the closest of these four.\n\n00:00:54.929 --> 00:01:02.043\nThe menu on the left has everything: people, examinations, academics, and the institution's settings.\n\n00:01:02.754 --> 00:01:09.095\nEach module shows one task, on the real application. Let's begin by creating the school's portal.\n", "hi": "WEBVTT\n\n00:00:00.400 --> 00:00:12.201\nस्वागत है। ScoreCode में स्कूल अपने छात्रों का रिकॉर्ड रखता है, अंक भरता है, और results publish करता है, जिन्हें छात्र देख सकते हैं और कोई भी जाँच सकता है।\n\n00:00:13.003 --> 00:00:22.080\nइस series में हम एक काल्पनिक स्कूल, Sunrise Public School, के साथ Class 10, Section A का Periodic Test 1 पूरा करेंगे।\n\n00:00:22.783 --> 00:00:30.713\nप्रधानाचार्या श्रीमती सुनीता शर्मा sign in करती हैं। Owner होने के नाते, उन्हें सबसे पहले dashboard दिखता है।\n\n00:00:31.454 --> 00:00:45.455\nAccount चार तरह के होते हैं। Owner, यहाँ प्रधानाचार्या। Administrators, जैसे परीक्षा समन्वयक। Faculty, यानी शिक्षक, जैसे Staff पेज पर श्री अमित कुमार। और Students।\n\n00:00:46.169 --> 00:00:54.218\nमाता-पिता, प्रधानाचार्य या समन्वयक के लिए अलग role नहीं है। हर व्यक्ति को इन चार में से सबसे सही role दें।\n\n00:00:54.929 --> 00:01:01.492\nबाईं ओर के menu में सब कुछ है: लोग, परीक्षाएँ, academics, और संस्था की settings।\n\n00:01:02.754 --> 00:01:10.119\nहर module असली application पर एक काम दिखाता है। चलिए, स्कूल का portal बनाने से शुरू करते हैं।\n"}}, {"id": "m02-create-portal", "title": {"en": "Module 2 · Create your school's portal", "hi": "भाग 2 · अपने स्कूल का पोर्टल बनाएँ"}, "role": "Owner (principal or school owner)", "plan": "Every plan (a new portal starts on Free)", "minutes": "1:47", "vtt": {"en": "WEBVTT\n\n00:00:00.000 --> 00:00:07.346\nIn this module, we create your school's ScoreCode portal. It takes about two minutes, and you only do it once.\n\n00:00:09.226 --> 00:00:12.582\nOpen the ScoreCode website and go to the sign-up page.\n\n00:00:13.773 --> 00:00:20.545\nType your school's name exactly as it should appear on marksheets. Here, we type Sunrise Public School.\n\n00:00:22.270 --> 00:00:30.392\nScoreCode suggests a portal address from the name. Check that it says Available. Students and staff will use this address to sign in.\n\n00:00:33.244 --> 00:00:37.560\nChoose the type of institution. For a CBSE school, choose School.\n\n00:00:38.598 --> 00:00:49.508\nNow enter your name and your email address. In this example, the principal, Mrs. Sunita Sharma, is creating the portal. The email address here is fictional.\n\n00:00:50.213 --> 00:00:56.827\nChoose a strong password of at least twelve characters that you do not use anywhere else. Keep it private.\n\n00:00:59.071 --> 00:01:04.639\nClick Create portal. ScoreCode now sends a verification email to the address you entered.\n\n00:01:06.219 --> 00:01:15.194\nOpen that email and click the link inside it. This proves the email address is yours. In this demonstration, we open the link directly.\n\n00:01:16.530 --> 00:01:24.993\nYour portal is ready, and you are signed in as the owner. The setup checklist shows the steps to complete before your first examination.\n\n00:01:26.739 --> 00:01:34.701\nA new portal starts on the Free plan, for up to one hundred and fifty students. ScoreCode can change your plan later.\n\n00:01:37.058 --> 00:01:44.218\nIn the next module, we set up the academic structure: the session, the class and section, and the subjects.\n", "hi": "WEBVTT\n\n00:00:00.000 --> 00:00:08.508\nइस भाग में हम आपके स्कूल का ScoreCode पोर्टल बनाएँगे। इसमें लगभग दो मिनट लगते हैं, और यह सिर्फ़ एक बार करना होता है।\n\n00:00:09.226 --> 00:00:13.062\nScoreCode की वेबसाइट खोलें और Sign up पेज पर जाएँ।\n\n00:00:13.773 --> 00:00:21.557\nस्कूल का नाम ठीक वैसे ही लिखें जैसे मार्कशीट पर छपना चाहिए। यहाँ हम Sunrise Public School लिख रहे हैं।\n\n00:00:22.270 --> 00:00:32.538\nScoreCode नाम से आपके पोर्टल का पता खुद सुझाता है। देख लें कि वहाँ Available लिखा हो। विद्यार्थी और स्टाफ़ इसी पते से लॉग इन करेंगे।\n\n00:00:33.244 --> 00:00:37.893\nसंस्था का प्रकार चुनें। CBSE स्कूल के लिए School चुनें।\n\n00:00:38.598 --> 00:00:48.838\nअब अपना नाम और ईमेल पता भरें। इस उदाहरण में प्रिंसिपल, Mrs. Sunita Sharma, पोर्टल बना रही हैं। यहाँ दिखाया गया ईमेल काल्पनिक है।\n\n00:00:50.213 --> 00:00:58.365\nकम से कम बारह अक्षरों का एक मज़बूत पासवर्ड चुनें, जो आप कहीं और इस्तेमाल न करते हों। इसे किसी को न बताएँ।\n\n00:00:59.071 --> 00:01:05.492\nCreate portal पर क्लिक करें। अब ScoreCode आपके ईमेल पर एक verification ईमेल भेजता है।\n\n00:01:06.219 --> 00:01:15.789\nवह ईमेल खोलें और उसमें दिए गए लिंक पर क्लिक करें। इससे साबित होता है कि ईमेल आपका ही है। इस डेमो में हम वह लिंक सीधे खोल रहे हैं।\n\n00:01:16.530 --> 00:01:26.027\nआपका पोर्टल तैयार है, और आप Owner के रूप में साइन इन हैं। Setup checklist में वे कदम दिखते हैं जो पहली परीक्षा से पहले पूरे करने हैं।\n\n00:01:26.739 --> 00:01:36.354\nनया पोर्टल Free plan पर शुरू होता है, जिसमें एक सौ पचास विद्यार्थियों तक की सुविधा है। बाद में ScoreCode आपका plan बदल सकता है।\n\n00:01:37.058 --> 00:01:43.199\nअगले भाग में हम academic structure बनाएँगे: सत्र, कक्षा और सेक्शन, और विषय।\n"}}, {"id": "m03-academic-structure", "title": {"en": "Module 3 · Academic structure: session, class, section and subjects", "hi": "भाग 3 · Academic structure: सत्र, कक्षा, सेक्शन और विषय"}, "role": "Owner or Administrator", "plan": "Every plan", "minutes": "2:14", "vtt": {"en": "WEBVTT\n\n00:00:00.400 --> 00:00:12.425\nBefore you create an examination, ScoreCode needs your academic structure: the session and its terms, the class and its sections, and the subjects. You set this up once a year.\n\n00:00:13.175 --> 00:00:15.695\nOpen Structure, in the menu on the left.\n\n00:00:16.408 --> 00:00:24.240\nClick New academic session. Keep the code short, like 2026 dash 27, and write the name in full.\n\n00:00:25.297 --> 00:00:35.988\nEnter the session dates, from the first of April 2026 to the thirty-first of March 2027. Make this the current session is already ticked.\n\n00:00:36.693 --> 00:00:40.322\nClick Create session. The new session is now marked Current.\n\n00:00:41.457 --> 00:00:49.441\nNow add the terms. Many CBSE schools use Term 1 and Term 2. Click Add term, enter the code T1 and the name Term 1.\n\n00:00:51.307 --> 00:00:54.188\nAdd Term 2 the same way, with the code T2.\n\n00:00:56.469 --> 00:01:04.384\nNext, open the Programs tab. In ScoreCode, a program is a class, such as Class 10. Click New program.\n\n00:01:05.559 --> 00:01:12.592\nEnter the code C10 and the name Class 10. The level, Secondary, is optional. Click Create program.\n\n00:01:14.906 --> 00:01:20.731\nNow open Cohorts. A cohort is one section of a class in this session. Click New cohort.\n\n00:01:23.044 --> 00:01:30.088\nChoose the session and the program, then enter the code 10A and the name Class 10, Section A. Click Create cohort.\n\n00:01:31.804 --> 00:01:39.264\nFinally, open Courses and add every subject you examine. Click New course, enter a short code and the subject name.\n\n00:01:41.918 --> 00:01:50.063\nCredits are optional. They are only used for university-style SGPA grading, so a CBSE school can leave them empty.\n\n00:01:52.927 --> 00:01:59.033\nWe add the remaining subjects the same way: Science, English, Hindi and Social Science.\n\n00:01:59.742 --> 00:02:10.455\nThe academic structure is ready: session 2026-27, Class 10 Section A, and five subjects. Next, we choose the grading scheme.\n", "hi": "WEBVTT\n\n00:00:00.400 --> 00:00:12.346\nपरीक्षा बनाने से पहले ScoreCode को आपका academic structure चाहिए: सत्र और उसके टर्म, कक्षा और उसके सेक्शन, और विषय। यह साल में एक बार बनाना होता है।\n\n00:00:13.175 --> 00:00:15.326\nबाएँ मेन्यू में Structure खोलें।\n\n00:00:16.408 --> 00:00:24.573\nNew academic session पर क्लिक करें। Code छोटा रखें, जैसे 2026-27, और Name पूरा लिखें।\n\n00:00:25.297 --> 00:00:35.043\nसत्र की तारीखें भरें, 1 अप्रैल 2026 से 31 मार्च 2027 तक। Make this the current session पहले से टिक है।\n\n00:00:36.693 --> 00:00:40.734\nCreate session पर क्लिक करें। नया सत्र अब Current दिखेगा।\n\n00:00:41.457 --> 00:00:50.594\nअब टर्म जोड़ें। कई CBSE स्कूल Term 1 और Term 2 रखते हैं। Add term पर क्लिक करें, code T1 और name Term 1 भरें।\n\n00:00:51.307 --> 00:00:54.580\nइसी तरह Term 2 जोड़ें, code T2 के साथ।\n\n00:00:56.469 --> 00:01:04.851\nअब Programs टैब खोलें। ScoreCode में program का मतलब कक्षा है, जैसे Class 10। New program पर क्लिक करें।\n\n00:01:05.559 --> 00:01:14.128\nCode C10 और name Class 10 भरें। Level, यानी Secondary, भरना ज़रूरी नहीं है। Create program पर क्लिक करें।\n\n00:01:14.906 --> 00:01:22.336\nअब Cohorts खोलें। Cohort इस सत्र में किसी कक्षा का एक सेक्शन होता है। New cohort पर क्लिक करें।\n\n00:01:23.044 --> 00:01:31.095\nSession और Program चुनें, फिर code 10A और name Class 10, Section A भरें। Create cohort पर क्लिक करें।\n\n00:01:31.804 --> 00:01:41.208\nआख़िर में Courses खोलें और हर वह विषय जोड़ें जिसकी परीक्षा होती है। New course पर क्लिक करें, एक छोटा code और विषय का नाम भरें।\n\n00:01:41.918 --> 00:01:52.217\nCredits भरना ज़रूरी नहीं है। ये सिर्फ़ यूनिवर्सिटी वाले SGPA grading में काम आते हैं, इसलिए CBSE स्कूल इन्हें खाली छोड़ सकता है।\n\n00:01:52.927 --> 00:01:58.851\nबाकी विषय भी इसी तरह जोड़ते हैं: Science, English, Hindi और Social Science।\n\n00:01:59.742 --> 00:02:10.168\nAcademic structure तैयार है: सत्र 2026-27, Class 10 Section A, और पाँच विषय। अगले भाग में हम grading scheme चुनेंगे।\n"}}, {"id": "m04-grading", "title": {"en": "Module 4 · Choose your grading scheme", "hi": "भाग 4 · अपनी grading scheme चुनें"}, "role": "Owner or Administrator", "plan": "Every plan", "minutes": "1:34", "vtt": {"en": "WEBVTT\n\n00:00:00.400 --> 00:00:08.884\nA grading scheme turns marks into grades and decides who passes. You choose a starting template, then adjust it to your school's rules.\n\n00:00:12.952 --> 00:00:15.960\nOpen Grading in the menu, then click New scheme.\n\n00:00:17.334 --> 00:00:31.820\nChoose the 9-band scale, CBSE-style. It gives grades A1 to E from percentage bands, with 33 percent to pass each subject. This is a starting template: please check it against your board's current rules.\n\n00:00:35.835 --> 00:00:40.906\nGive the scheme a clear name, such as Class 10 grading, and click Create scheme.\n\n00:00:42.309 --> 00:00:47.957\nHere you see every band and the pass mark. You can change any of them before you use the scheme.\n\n00:00:50.730 --> 00:00:57.902\nThe Try it box calculates sample marks with this scheme, so you can check the result before any real examination.\n\n00:01:00.050 --> 00:01:10.275\nBack in the list, the first scheme is already your school's default, so new examinations use it. With more than one scheme, choose Make default from its menu.\n\n00:01:14.511 --> 00:01:22.078\nIf you change a scheme later, ScoreCode saves a new version. Results that were already processed keep the version they used.\n\n00:01:25.828 --> 00:01:29.679\nNext, we add the students of Class 10, Section A.\n", "hi": "WEBVTT\n\n00:00:00.400 --> 00:00:12.222\nGrading scheme अंकों को grades में बदलती है और तय करती है कि कौन पास है। आप एक template से शुरू करते हैं, फिर उसे अपने स्कूल के नियमों के हिसाब से बदल सकते हैं।\n\n00:00:12.952 --> 00:00:16.622\nमेन्यू में Grading खोलें, फिर New scheme पर क्लिक करें।\n\n00:00:17.334 --> 00:00:35.124\n9-band scale, CBSE-style चुनें। इसमें प्रतिशत के हिसाब से A1 से E तक grades मिलते हैं, और हर विषय में पास होने के लिए 33 प्रतिशत चाहिए। यह सिर्फ़ शुरुआती template है: इसे अपने बोर्ड के मौजूदा नियमों से मिलाकर ज़रूर देखें।\n\n00:00:35.835 --> 00:00:41.552\nScheme को साफ़ नाम दें, जैसे Class 10 grading, और Create scheme पर क्लिक करें।\n\n00:00:42.309 --> 00:00:50.022\nयहाँ हर band और पास होने के अंक दिखते हैं। Scheme इस्तेमाल करने से पहले आप इनमें से कुछ भी बदल सकते हैं।\n\n00:00:50.730 --> 00:00:59.338\nTry it बॉक्स इस scheme से उदाहरण वाले अंकों का नतीजा निकालता है, ताकि असली परीक्षा से पहले आप परिणाम जाँच सकें।\n\n00:01:00.050 --> 00:01:13.790\nसूची में वापस जाकर देखें: पहली scheme अपने आप स्कूल की default बन जाती है, इसलिए नई परीक्षाएँ इसी को इस्तेमाल करती हैं। एक से ज़्यादा scheme हों, तो उसके menu से Make default चुनें।\n\n00:01:14.511 --> 00:01:25.122\nअगर बाद में आप scheme बदलते हैं, तो ScoreCode उसका नया version बनाता है। जिन परिणामों की गणना पहले हो चुकी है, वे पुराने version पर ही रहते हैं।\n\n00:01:25.828 --> 00:01:30.089\nअगले भाग में हम Class 10, Section A के विद्यार्थी जोड़ेंगे।\n"}}, {"id": "m05-students", "title": {"en": "Module 5 · Add and import students", "hi": "भाग 5 · विद्यार्थी जोड़ें और import करें"}, "role": "Owner or Administrator", "plan": "Every plan (Free: up to 150 active students; 5,000 rows per import)", "minutes": "1:59", "vtt": {"en": "WEBVTT\n\n00:00:00.400 --> 00:00:07.259\nThere are two ways to add students: one at a time, or many at once from a spreadsheet. We show both.\n\n00:00:08.686 --> 00:00:11.694\nOpen Students in the menu and click Add student.\n\n00:00:13.258 --> 00:00:23.124\nEnter the enrollment number and the full name. The enrollment number must be unique, because the student will use it to sign in. Here we add Aarav Sharma.\n\n00:00:25.855 --> 00:00:30.090\nIn the Cohort field, choose his section: Class 10, Section A.\n\n00:00:31.432 --> 00:00:35.189\nClick Add student. Aarav's page opens, with his section.\n\n00:00:37.479 --> 00:00:46.144\nTo let Aarav create his own password, click Issue activation code. The code is shown only once: give it to the student or print it.\n\n00:00:48.706 --> 00:00:55.959\nNow the faster way. Open Imports. You can upload a CSV or Excel file with one row for each student.\n\n00:00:58.161 --> 00:01:06.717\nWe upload a file with some mistakes on purpose: a missing name, an enrollment number written twice, and a section that doesn't exist.\n\n00:01:10.317 --> 00:01:16.616\nScoreCode checks every row first and saves nothing yet. Each problem is listed with its row and a reason.\n\n00:01:19.438 --> 00:01:27.184\nCorrect the file and click Upload fixed file. You can also download the checked file to see the problems inside your spreadsheet.\n\n00:01:29.007 --> 00:01:34.704\nNow every row is correct. ScoreCode tells you exactly how many new students will be added.\n\n00:01:35.510 --> 00:01:39.516\nOnly now does anything change. Click Import, and confirm.\n\n00:01:41.069 --> 00:01:45.698\nThe import is complete. Open the student list to check the new students.\n\n00:01:46.893 --> 00:01:53.902\nRemember the order: upload, check, fix, and only then import. Next, we invite the teachers.\n", "hi": "WEBVTT\n\n00:00:00.400 --> 00:00:07.939\nविद्यार्थी जोड़ने के दो तरीके हैं: एक-एक करके, या एक spreadsheet से एक साथ कई। हम दोनों दिखाएँगे।\n\n00:00:08.686 --> 00:00:12.532\nमेन्यू में Students खोलें और Add student पर क्लिक करें।\n\n00:00:13.258 --> 00:00:25.144\nEnrollment number और पूरा नाम भरें। Enrollment number हर विद्यार्थी का अलग होना चाहिए, क्योंकि विद्यार्थी इसी से लॉग इन करेगा। यहाँ हम Aarav Sharma को जोड़ रहे हैं।\n\n00:00:25.855 --> 00:00:30.721\nCohort वाले खाने में उसका सेक्शन चुनें: Class 10, Section A।\n\n00:00:31.432 --> 00:00:36.773\nAdd student पर क्लिक करें। Aarav का पेज उसके सेक्शन के साथ खुल जाता है।\n\n00:00:37.479 --> 00:00:47.998\nAarav को अपना पासवर्ड खुद बनाने देने के लिए Issue activation code पर क्लिक करें। यह code सिर्फ़ एक बार दिखता है: इसे विद्यार्थी को दें या print करें।\n\n00:00:48.706 --> 00:00:57.448\nअब तेज़ तरीका। Imports खोलें। आप CSV या Excel फ़ाइल upload कर सकते हैं, जिसमें हर विद्यार्थी की एक पंक्ति हो।\n\n00:00:58.161 --> 00:01:09.566\nहम जानबूझकर कुछ गलतियों वाली फ़ाइल upload कर रहे हैं: एक नाम छूटा हुआ है, एक enrollment number दो बार लिखा है, और एक ऐसा सेक्शन है जो मौजूद नहीं है।\n\n00:01:10.317 --> 00:01:18.728\nScoreCode पहले हर पंक्ति जाँचता है और अभी कुछ भी save नहीं करता। हर गलती उसकी पंक्ति और कारण के साथ दिखती है।\n\n00:01:19.438 --> 00:01:28.293\nफ़ाइल ठीक करें और Upload fixed file पर क्लिक करें। आप checked फ़ाइल download करके अपनी spreadsheet में भी गलतियाँ देख सकते हैं।\n\n00:01:29.007 --> 00:01:34.800\nअब हर पंक्ति सही है। ScoreCode साफ़ बताता है कि कितने नए विद्यार्थी जुड़ेंगे।\n\n00:01:35.510 --> 00:01:40.363\nअब जाकर ही कुछ बदलता है। Import पर क्लिक करें, और पुष्टि करें।\n\n00:01:41.069 --> 00:01:46.175\nImport पूरा हो गया। नए विद्यार्थियों को देखने के लिए student list खोलें।\n\n00:01:46.893 --> 00:01:55.474\nक्रम याद रखें: upload, जाँच, सुधार, और उसके बाद ही import। अगले भाग में हम शिक्षकों को आमंत्रित करेंगे।\n"}}, {"id": "m06-staff", "title": {"en": "Module 6 · Invite teachers and staff", "hi": "भाग 6 · शिक्षकों और स्टाफ़ को आमंत्रित करें"}, "role": "Owner or Administrator (teacher: Faculty)", "plan": "Every plan (Free: 5 staff accounts, 2 of them administrators)", "minutes": "1:13", "vtt": {"en": "WEBVTT\n\n00:00:00.400 --> 00:00:08.912\nEach teacher gets their own account. A teacher, called Faculty in ScoreCode, can enter marks only for the subjects you assign to them.\n\n00:00:11.608 --> 00:00:14.662\nOpen Staff in the menu and click Invite staff.\n\n00:00:16.027 --> 00:00:24.024\nEnter the teacher's name and email. Here, our mathematics teacher, Mr. Amit Kumar. The email address is fictional.\n\n00:00:24.734 --> 00:00:34.808\nChoose the role. Faculty enters marks. Administrator manages students, examinations, results and settings. For a teacher, choose Faculty.\n\n00:00:35.899 --> 00:00:39.807\nClick Send invitation. The teacher receives an email with a link.\n\n00:00:41.851 --> 00:00:46.121\nThe teacher appears in the staff list as invited, until they accept.\n\n00:00:47.647 --> 00:00:54.575\nNow we see what the teacher does. They open the link in the email, choose a password, and click Create account.\n\n00:00:56.942 --> 00:01:04.021\nThe teacher lands on Marks entry. They see only their own assignments, and none of the administrative menus.\n\n00:01:04.731 --> 00:01:09.500\nNext, a student activates their account and signs in for the first time.\n", "hi": "WEBVTT\n\n00:00:00.400 --> 00:00:10.830\nहर शिक्षक का अपना account होता है। शिक्षक, जिन्हें ScoreCode में Faculty कहते हैं, सिर्फ़ उन्हीं विषयों के अंक भर सकते हैं जो आप उन्हें देते हैं।\n\n00:00:11.608 --> 00:00:15.315\nमेन्यू में Staff खोलें और Invite staff पर क्लिक करें।\n\n00:00:16.027 --> 00:00:23.870\nशिक्षक का नाम और ईमेल भरें। यहाँ हमारे गणित शिक्षक, Mr. Amit Kumar। यह ईमेल पता काल्पनिक है।\n\n00:00:24.734 --> 00:00:35.176\nRole चुनें। Faculty अंक भरते हैं। Administrator विद्यार्थी, परीक्षाएँ, परिणाम और settings संभालते हैं। शिक्षक के लिए Faculty चुनें।\n\n00:00:35.899 --> 00:00:41.128\nSend invitation पर क्लिक करें। शिक्षक को एक लिंक वाला ईमेल मिलता है।\n\n00:00:41.851 --> 00:00:46.938\nजब तक शिक्षक स्वीकार नहीं करते, वे staff list में invited दिखते हैं।\n\n00:00:47.647 --> 00:00:56.226\nअब देखते हैं कि शिक्षक क्या करते हैं। वे ईमेल का लिंक खोलते हैं, पासवर्ड चुनते हैं, और Create account पर क्लिक करते हैं।\n\n00:00:56.942 --> 00:01:03.961\nशिक्षक सीधे Marks entry पर पहुँचते हैं। उन्हें सिर्फ़ अपने काम दिखते हैं, administrative मेन्यू नहीं।\n\n00:01:04.731 --> 00:01:10.350\nअगले भाग में एक विद्यार्थी अपना account activate करके पहली बार लॉग इन करेगा।\n"}}, {"id": "m07-student-activation", "title": {"en": "Module 7 · A student activates their account", "hi": "भाग 7 · विद्यार्थी अपना account activate करता है"}, "role": "Student", "plan": "Every plan", "minutes": "1:05", "vtt": {"en": "WEBVTT\n\n00:00:00.400 --> 00:00:09.070\nThis module is for students, and for staff who help them. The student needs their enrollment number and the activation code from the school.\n\n00:00:11.953 --> 00:00:16.203\nOn the school's sign-in page, click Activate your student account.\n\n00:00:17.330 --> 00:00:21.797\nEnter the enrollment number and the activation code exactly as printed.\n\n00:00:23.026 --> 00:00:27.551\nChoose a password of at least ten characters and type it again to confirm.\n\n00:00:28.855 --> 00:00:34.539\nClick Activate and sign in. The code now stops working, so nobody else can use it.\n\n00:00:37.926 --> 00:00:44.893\nAarav is now in his student portal. There are no results yet. They will appear here when the school publishes them.\n\n00:00:47.169 --> 00:00:55.520\nTo sign out, open the account menu and click Sign out. Next time, Aarav signs in with his enrollment number and password.\n\n00:00:57.450 --> 00:01:01.429\nNext, we create the examination: Periodic Test 1.\n", "hi": "WEBVTT\n\n00:00:00.400 --> 00:00:11.189\nयह भाग विद्यार्थियों के लिए है, और उन स्टाफ़ के लिए जो उनकी मदद करते हैं। विद्यार्थी को अपना enrollment number और स्कूल से मिला activation code चाहिए।\n\n00:00:11.953 --> 00:00:16.614\nस्कूल के sign-in पेज पर Activate your student account पर क्लिक करें।\n\n00:00:17.330 --> 00:00:22.321\nEnrollment number और activation code ठीक वैसे ही भरें जैसे छपे हैं।\n\n00:00:23.026 --> 00:00:28.148\nकम से कम दस अक्षरों का पासवर्ड चुनें और पुष्टि के लिए उसे दोबारा लिखें।\n\n00:00:28.855 --> 00:00:37.214\nActivate and sign in पर क्लिक करें। अब यह code काम करना बंद कर देता है, ताकि कोई और इसका इस्तेमाल न कर सके।\n\n00:00:37.926 --> 00:00:46.459\nAarav अब अपने student portal में है। अभी कोई परिणाम नहीं है। जब स्कूल परिणाम प्रकाशित करेगा, वे यहीं दिखेंगे।\n\n00:00:47.169 --> 00:00:56.741\nSign out करने के लिए account menu खोलें और Sign out पर क्लिक करें। अगली बार Aarav अपने enrollment number और पासवर्ड से लॉग इन करेगा।\n\n00:00:57.450 --> 00:01:01.339\nअगले भाग में हम परीक्षा बनाएँगे: Periodic Test 1।\n"}}, {"id": "m08-exam-setup", "title": {"en": "Module 8 · Set up an exam", "hi": "भाग 8 · परीक्षा तैयार करें"}, "role": "Owner or Administrator", "plan": "Every plan", "minutes": "1:37", "vtt": {"en": "WEBVTT\n\n00:00:00.400 --> 00:00:08.794\nNow we set up the exam itself: Periodic Test 1, October 2026, for Class 10, Section A.\n\n00:00:09.544 --> 00:00:12.494\nOpen Exams from the menu and choose New exam.\n\n00:00:13.446 --> 00:00:17.188\nType the exam's name, and choose its kind: Unit test.\n\n00:00:17.894 --> 00:00:24.160\nThe session and term are filled in for you. The grading scheme is the default we made: Class 10 grading.\n\n00:00:26.385 --> 00:00:31.741\nTick the section that sits this exam: Class 10, Section A. Then create the exam.\n\n00:00:33.683 --> 00:00:40.158\nThe exam starts as a draft. This list shows what is still needed before teachers can enter marks.\n\n00:00:41.221 --> 00:00:45.658\nEach subject is a paper. Add paper, and choose Mathematics.\n\n00:00:46.852 --> 00:00:54.350\nA paper is made of components. Choose the Internal 40 plus External 60 preset, and rename External to Written.\n\n00:00:58.134 --> 00:01:04.215\nThe paper is out of 100. The pass mark comes from the grading scheme: 33 percent.\n\n00:01:05.124 --> 00:01:11.093\nAdd the other four subjects the same way: Science, English, Hindi and Social Science.\n\n00:01:11.860 --> 00:01:19.171\nNow assign the teacher. From the Mathematics paper's menu, choose Assign faculty, tick Amit Kumar, and save.\n\n00:01:20.165 --> 00:01:26.304\nEverything is ready. Open marks entry, and teachers can start entering marks for their papers.\n\n00:01:27.142 --> 00:01:33.871\nPapers can still be added while entry is open. Next, Mr. Amit Kumar enters the Mathematics marks.\n", "hi": "WEBVTT\n\n00:00:00.400 --> 00:00:07.946\nअब हम परीक्षा बनाते हैं: Periodic Test 1, October 2026, Class 10, Section A के लिए।\n\n00:00:09.544 --> 00:00:12.728\nमेनू में Exams खोलें और New exam चुनें।\n\n00:00:13.446 --> 00:00:17.126\nपरीक्षा का नाम लिखें, और Kind में Unit test चुनें।\n\n00:00:17.894 --> 00:00:25.679\nSession और Term अपने आप भर जाते हैं। Grading scheme वही है जो हमने default बनाई थी: Class 10 grading।\n\n00:00:26.385 --> 00:00:32.969\nजो सेक्शन यह परीक्षा देगा उसे चुनें: Class 10, Section A। फिर Create exam दबाएँ।\n\n00:00:33.683 --> 00:00:40.509\nपरीक्षा पहले Draft रहती है। यह सूची बताती है कि अंक भरने से पहले और क्या करना बाकी है।\n\n00:00:41.221 --> 00:00:46.136\nहर विषय एक paper होता है। Add paper दबाएँ और Mathematics चुनें।\n\n00:00:46.852 --> 00:00:57.428\nPaper के हिस्से होते हैं, जिन्हें components कहते हैं। Internal 40 + External 60 वाला preset चुनें, और External का नाम बदलकर Written रखें।\n\n00:00:58.134 --> 00:01:04.414\nPaper 100 अंकों का है। पास होने के अंक grading scheme से आते हैं: 33 प्रतिशत।\n\n00:01:05.124 --> 00:01:11.153\nबाकी चार विषय भी इसी तरह जोड़ें: Science, English, Hindi और Social Science।\n\n00:01:11.860 --> 00:01:19.441\nअब शिक्षक तय करें। Mathematics paper के menu से Assign faculty चुनें, Amit Kumar को चुनें और Save करें।\n\n00:01:20.165 --> 00:01:26.428\nसब तैयार है। Open marks entry दबाएँ, अब शिक्षक अपने paper के अंक भर सकते हैं।\n\n00:01:27.142 --> 00:01:34.080\nEntry खुली होने पर भी paper जोड़े जा सकते हैं। आगे, श्री अमित कुमार Mathematics के अंक भरेंगे।\n"}}, {"id": "m09-marks-entry", "title": {"en": "Module 9 · Enter and import marks", "hi": "भाग 9 · अंक भरें और import करें"}, "role": "Faculty (their own papers); Owner or Administrator (every paper, and imports)", "plan": "Every plan", "minutes": "2:07", "vtt": {"en": "WEBVTT\n\n00:00:00.400 --> 00:00:07.897\nMr. Amit Kumar teaches Mathematics. He signs in with his own account, and sees only the papers assigned to him.\n\n00:00:09.120 --> 00:00:16.304\nMarks entry lists his paper: Mathematics for Class 10, Section A, with how many students are done.\n\n00:00:17.642 --> 00:00:23.812\nHe opens it. Each row is a student; there is a column for each component, Internal and Written.\n\n00:00:25.134 --> 00:00:34.264\nHe types Aarav's marks: 36 out of 40, and 52 out of 60. Press Enter to move down. The total appears straight away.\n\n00:00:35.961 --> 00:00:44.945\nA typing mistake: 65 in Written, where the most is 60. The cell turns red and says what is wrong. Nothing wrong is saved.\n\n00:00:46.086 --> 00:00:47.937\nHe corrects it to 55.\n\n00:00:49.408 --> 00:00:54.919\nRohan was absent. Type A B instead of a mark; it counts for the whole paper.\n\n00:00:56.281 --> 00:01:01.488\nFor the rest, he copies the marks from his Excel sheet and pastes them in one go.\n\n00:01:02.822 --> 00:01:06.917\nMarks save as he types. Here it says: All changes saved.\n\n00:01:08.309 --> 00:01:16.250\nWhen every student is done, he submits the paper. After that, only an administrator can send it back for changes.\n\n00:01:17.629 --> 00:01:25.846\nMarks can also come from a spreadsheet. Mrs. Sunita Sharma, signed in as the owner, enters the Science marks this way.\n\n00:01:27.298 --> 00:01:33.702\nShe opens the Science paper and chooses Import from Excel. The template has the right columns already.\n\n00:01:34.962 --> 00:01:41.958\nShe uploads the file. The check finds one mark above 40 in Internal, and saves nothing until she decides.\n\n00:01:44.541 --> 00:01:48.797\nShe corrects the file and uploads it again. Now every row is ready.\n\n00:01:50.026 --> 00:01:54.376\nImport, then Save marks. The Science marks are now in the grid.\n\n00:01:55.215 --> 00:02:02.178\nEnglish, Hindi and Social Science are entered the same way. Next, we turn these marks into results.\n", "hi": "WEBVTT\n\n00:00:00.400 --> 00:00:08.394\nश्री अमित कुमार Mathematics पढ़ाते हैं। वे अपने account से sign in करते हैं, और उन्हें सिर्फ़ अपने paper दिखते हैं।\n\n00:00:09.120 --> 00:00:16.934\nMarks entry में उनका paper दिखता है: Class 10, Section A का Mathematics, और कितने बच्चों के अंक भरे गए।\n\n00:00:17.642 --> 00:00:24.426\nवे इसे खोलते हैं। हर पंक्ति एक छात्र है; हर हिस्से का अलग कॉलम है, Internal और Written।\n\n00:00:25.134 --> 00:00:35.250\nवे आरव के अंक लिखते हैं: 40 में से 36, और 60 में से 52। Enter दबाने पर नीचे की पंक्ति आती है। Total तुरंत दिख जाता है।\n\n00:00:35.961 --> 00:00:45.382\nएक गलती: Written में 65, जबकि ज़्यादा से ज़्यादा 60 हैं। खाना लाल हो जाता है और गलती बताता है। गलत अंक save नहीं होते।\n\n00:00:46.086 --> 00:00:48.702\nवे इसे सुधारकर 55 कर देते हैं।\n\n00:00:49.408 --> 00:00:55.568\nरोहन अनुपस्थित था। अंक की जगह AB लिखें; यह पूरे paper के लिए माना जाता है।\n\n00:00:56.281 --> 00:01:02.113\nबाकी बच्चों के अंक वे अपनी Excel sheet से copy करके एक बार में paste कर देते हैं।\n\n00:01:02.822 --> 00:01:07.605\nअंक लिखते ही save हो जाते हैं। यहाँ लिखा है: All changes saved।\n\n00:01:08.309 --> 00:01:16.905\nसब बच्चों के अंक भरने के बाद वे paper Submit करते हैं। इसके बाद सिर्फ़ administrator ही इसे बदलाव के लिए लौटा सकते हैं।\n\n00:01:17.629 --> 00:01:26.475\nअंक spreadsheet से भी आ सकते हैं। श्रीमती सुनीता शर्मा, owner के रूप में sign in करके, Science के अंक इसी तरह भरती हैं।\n\n00:01:27.298 --> 00:01:34.256\nवे Science का paper खोलकर Import from Excel चुनती हैं। Template में सही कॉलम पहले से होते हैं।\n\n00:01:34.962 --> 00:01:43.812\nवे file upload करती हैं। जाँच में Internal में 40 से ज़्यादा का एक अंक मिलता है, और फ़ैसला होने तक कुछ भी save नहीं होता।\n\n00:01:44.541 --> 00:01:49.317\nवे file सुधारकर फिर से upload करती हैं। अब हर पंक्ति तैयार है।\n\n00:01:50.026 --> 00:01:54.508\nImport, फिर Save marks दबाएँ। Science के अंक अब grid में हैं।\n\n00:01:55.215 --> 00:02:03.040\nEnglish, Hindi और Social Science के अंक भी इसी तरह भरे जाते हैं। आगे, हम इन अंकों से result बनाएँगे।\n"}}, {"id": "m10-results", "title": {"en": "Module 10 · Process, approve and publish results", "hi": "भाग 10 · Results बनाएँ, approve और publish करें"}, "role": "Owner or Administrator", "plan": "Every plan (two-person approval and scheduled publication: Growth and Pro)", "minutes": "2:01", "vtt": {"en": "WEBVTT\n\n00:00:00.400 --> 00:00:09.944\nAll five subjects have marks. Now Mrs. Sunita Sharma turns them into results, checks them, approves them, and publishes them to students.\n\n00:00:11.286 --> 00:00:20.882\nFirst, on the exam's Setup page, close marks entry. Teachers can no longer change marks; it can be reopened, with a reason, if needed.\n\n00:00:22.523 --> 00:00:31.638\nOpen the Results tab. Only Mathematics was submitted by its teacher; the others were entered by the office, so ScoreCode asks for a reason.\n\n00:00:32.543 --> 00:00:39.842\nChoose Process results, write the reason, and confirm. Every result is computed with the Class 10 grading scheme.\n\n00:00:42.297 --> 00:00:49.257\nHere is the summary: how many students passed, and how many did not. Nothing is visible to students yet.\n\n00:00:49.963 --> 00:00:58.682\nWorth a look lists things to check before approving, such as missing marks. Here it notes that some papers were processed before they were submitted.\n\n00:01:02.276 --> 00:01:07.594\nOpen any student to see their result exactly as they will see it. This is Aarav's.\n\n00:01:09.700 --> 00:01:17.118\nEverything looks right, so approve the results. Approving locks every mark and records this exact set of results.\n\n00:01:19.176 --> 00:01:27.048\nOn Growth and Pro you can schedule results to go live at a set time. Sunrise is on the Free plan, so we publish now.\n\n00:01:29.972 --> 00:01:34.959\nPublish now, and confirm. Each student sees their own result straight away.\n\n00:01:36.748 --> 00:01:43.686\nScoreCode now prepares a PDF marksheet for every student. Here it shows them being prepared, and then ready.\n\n00:01:46.663 --> 00:01:55.565\nIf a mistake is found later, results can be withdrawn with a reason, or corrected and published again. Next, what a student sees.\n", "hi": "WEBVTT\n\n00:00:00.400 --> 00:00:10.558\nपाँचों विषयों के अंक भर गए हैं। अब श्रीमती सुनीता शर्मा इनसे result बनाएँगी, जाँचेंगी, approve करेंगी, और छात्रों के लिए publish करेंगी।\n\n00:00:11.286 --> 00:00:21.804\nपहले, परीक्षा के Setup पेज पर Close marks entry दबाएँ। अब शिक्षक अंक नहीं बदल सकते; ज़रूरत हो तो कारण लिखकर इसे फिर खोला जा सकता है।\n\n00:00:22.523 --> 00:00:31.839\nResults tab खोलें। सिर्फ़ Mathematics शिक्षक ने submit किया था; बाकी अंक office ने भरे, इसलिए ScoreCode कारण पूछता है।\n\n00:00:32.543 --> 00:00:40.066\nProcess results चुनें, कारण लिखें, और पुष्टि करें। हर result Class 10 grading scheme से बनता है।\n\n00:00:42.297 --> 00:00:48.732\nयह सारांश है: कितने छात्र पास हुए, और कितने नहीं। छात्रों को अभी कुछ नहीं दिखता।\n\n00:00:49.963 --> 00:01:01.565\nWorth a look में वो बातें होती हैं जिन्हें approve करने से पहले देखना चाहिए, जैसे छूटे हुए अंक। यहाँ बताया गया है कि कुछ paper submit होने से पहले process हुए।\n\n00:01:02.276 --> 00:01:08.990\nकिसी भी छात्र को खोलकर उसका result वैसे ही देखें जैसे वह देखेगा। यह आरव का result है।\n\n00:01:09.700 --> 00:01:18.436\nसब सही है, इसलिए results approve करें। Approve करते ही सारे अंक lock हो जाते हैं और यही results दर्ज हो जाते हैं।\n\n00:01:19.176 --> 00:01:29.257\nGrowth और Pro plan पर results तय समय पर live करने के लिए schedule किए जा सकते हैं। Sunrise Free plan पर है, इसलिए हम अभी publish करेंगे।\n\n00:01:29.972 --> 00:01:36.032\nPublish now दबाएँ और पुष्टि करें। हर छात्र को उसका अपना result तुरंत दिखता है।\n\n00:01:36.748 --> 00:01:45.954\nअब ScoreCode हर छात्र की PDF marksheet तैयार करता है। यहाँ दिखता है कि marksheets बन रही हैं, और फिर तैयार हो जाती हैं।\n\n00:01:46.663 --> 00:01:58.099\nअगर बाद में कोई गलती मिले, तो कारण लिखकर results वापस लिए जा सकते हैं, या सुधारकर फिर से publish किए जा सकते हैं। आगे देखेंगे कि छात्र को क्या दिखता है।\n"}}, {"id": "m11-student-result", "title": {"en": "Module 11 · What students see, and verifying a marksheet", "hi": "भाग 11 · छात्र क्या देखते हैं, और marksheet की जाँच"}, "role": "Student; anyone verifying (no account)", "plan": "Every plan", "minutes": "1:24", "vtt": {"en": "WEBVTT\n\n00:00:00.400 --> 00:00:07.293\nResults are live. Aarav Sharma signs in on the school's portal with his enrollment number and the password he chose.\n\n00:00:10.036 --> 00:00:15.072\nThe bell shows a new notification: his Periodic Test 1 results are available.\n\n00:00:15.836 --> 00:00:19.649\nHis home page shows the latest result, and whether he passed.\n\n00:00:22.101 --> 00:00:29.374\nHe opens it: his percentage, his overall grade, and the marks for every subject, component by component.\n\n00:00:30.084 --> 00:00:36.548\nThe student portal can also be read in Hindi. Choose it from Language; the choice stays on this device.\n\n00:00:38.415 --> 00:00:43.985\nBelow is the official PDF marksheet. Download saves it to the phone or computer.\n\n00:00:46.245 --> 00:00:52.872\nEvery marksheet has a verification link and code. A college or anyone else can check that it is genuine.\n\n00:00:55.169 --> 00:01:04.891\nHere is that check, with no account needed. It says Valid, and shows the file's fingerprint. Names are partly hidden, and marks are never shown here.\n\n00:01:06.979 --> 00:01:15.997\nThere is no separate parent login. Parents, like Mr. Anil Sharma, see results with their child, or receive the PDF marksheet.\n\n00:01:18.266 --> 00:01:21.502\nNext, the plan, usage and school settings.\n", "hi": "WEBVTT\n\n00:00:00.400 --> 00:00:09.230\nResults live हो गए हैं। आरव शर्मा स्कूल के portal पर अपनी enrollment number और अपने चुने हुए password से sign in करते हैं।\n\n00:00:10.036 --> 00:00:15.127\nघंटी में नई सूचना है: उनके Periodic Test 1 के results आ गए हैं।\n\n00:00:15.836 --> 00:00:21.396\nउनके home page पर सबसे नया result दिखता है, और यह कि वे पास हुए या नहीं।\n\n00:00:22.101 --> 00:00:28.525\nवे इसे खोलते हैं: उनका प्रतिशत, कुल grade, और हर विषय के अंक, हर हिस्से के साथ।\n\n00:00:30.084 --> 00:00:37.707\nछात्र portal हिंदी में भी पढ़ा जा सकता है। Language में हिंदी चुनें; यह चुनाव इसी device पर बना रहता है।\n\n00:00:38.415 --> 00:00:45.524\nनीचे आधिकारिक PDF marksheet है। Download दबाने पर यह phone या computer में save हो जाती है।\n\n00:00:46.245 --> 00:00:54.457\nहर marksheet के साथ एक verification link और code होता है। कोई college या कोई और जाँच सकता है कि यह असली है।\n\n00:00:55.169 --> 00:01:06.272\nयह वही जाँच है, बिना किसी account के। यहाँ Valid लिखा है, और file का fingerprint दिखता है। नाम आधे छिपे रहते हैं, और अंक यहाँ कभी नहीं दिखते।\n\n00:01:06.979 --> 00:01:17.557\nमाता-पिता के लिए अलग login नहीं है। श्री अनिल शर्मा जैसे अभिभावक अपने बच्चे के साथ result देखते हैं, या उन्हें PDF marksheet मिलती है।\n\n00:01:18.266 --> 00:01:21.598\nआगे, plan, usage और स्कूल की settings।\n"}}, {"id": "m12-plan-settings", "title": {"en": "Module 12 · Plan, usage, settings and branding", "hi": "भाग 12 · Plan, usage, settings और branding"}, "role": "Owner (trial, data export); Owner or Administrator (settings, branding)", "plan": "Every plan (theme and login page: Starter and above)", "minutes": "1:31", "vtt": {"en": "WEBVTT\n\n00:00:00.400 --> 00:00:07.855\nOnly the owner and administrators see these pages: the school's plan and usage, its settings, and its branding.\n\n00:00:08.586 --> 00:00:12.952\nOpen Plan and usage. Sunrise Public School is on the Free plan.\n\n00:00:13.676 --> 00:00:22.894\nUsage shows how much of each limit is used: students, staff accounts, administrators, storage, and publications this year.\n\n00:00:23.633 --> 00:00:31.866\nCompare plans shows what each plan includes. ScoreCode does not take payments in the app; to change plan, write to ScoreCode.\n\n00:00:33.207 --> 00:00:42.388\nThe owner can start one free trial of the Pro features, for thirty days. No card is needed, and afterwards the school simply returns to Free.\n\n00:00:43.809 --> 00:00:49.984\nNow Settings. The official name and address appear on every marksheet, so check them carefully.\n\n00:00:51.226 --> 00:00:55.907\nAdd the board under Affiliation, here C B S E, and save the changes.\n\n00:00:57.089 --> 00:01:07.070\nResults policy decides how students activate their accounts, what the verification page shows, what class statistics students see, and their language.\n\n00:01:08.975 --> 00:01:14.490\nUnder Branding, upload the school's logo. It appears on the portal and on marksheets.\n\n00:01:15.227 --> 00:01:20.876\nColours and the login page design come with the Starter plan and above, so they are locked here.\n\n00:01:22.819 --> 00:01:27.831\nNext, the audit log, notifications, and exporting the school's data.\n", "hi": "WEBVTT\n\n00:00:00.400 --> 00:00:07.847\nये पेज सिर्फ़ owner और administrators देखते हैं: स्कूल का plan और usage, उसकी settings, और branding।\n\n00:00:08.586 --> 00:00:12.962\nPlan & usage खोलें। Sunrise Public School Free plan पर है।\n\n00:00:13.676 --> 00:00:22.921\nUsage में हर सीमा का इस्तेमाल दिखता है: छात्र, staff accounts, administrators, storage, और इस साल के publications।\n\n00:00:23.633 --> 00:00:32.493\nCompare plans में हर plan की सुविधाएँ दिखती हैं। ScoreCode app में payment नहीं लेता; plan बदलने के लिए ScoreCode को लिखें।\n\n00:00:33.207 --> 00:00:43.098\nOwner एक बार Pro सुविधाओं का तीस दिन का free trial शुरू कर सकते हैं। कोई card नहीं चाहिए, और बाद में स्कूल अपने आप Free पर लौट आता है।\n\n00:00:43.809 --> 00:00:50.519\nअब Settings। आधिकारिक नाम और पता हर marksheet पर छपते हैं, इसलिए इन्हें ध्यान से जाँचें।\n\n00:00:51.226 --> 00:00:56.369\nAffiliation में board लिखें, यहाँ CBSE, और Save changes दबाएँ।\n\n00:00:57.089 --> 00:01:08.267\nResults policy तय करती है कि छात्र account कैसे शुरू करें, verification page पर क्या दिखे, छात्रों को कक्षा के कौन से आँकड़े दिखें, और उनकी भाषा।\n\n00:01:08.975 --> 00:01:14.424\nBranding में स्कूल का logo upload करें। यह portal और marksheets पर दिखता है।\n\n00:01:15.227 --> 00:01:22.114\nColours और login page का design Starter plan और उससे ऊपर मिलता है, इसलिए यहाँ ये बंद हैं।\n\n00:01:22.819 --> 00:01:27.510\nआगे, audit log, सूचनाएँ, और स्कूल का data export करना।\n"}}, {"id": "m13-audit-export", "title": {"en": "Module 13 · Audit log and data export", "hi": "भाग 13 · Audit log और data export"}, "role": "Owner or Administrator (audit log); Owner only (export)", "plan": "Every plan", "minutes": "1:03", "vtt": {"en": "WEBVTT\n\n00:00:00.400 --> 00:00:06.248\nScoreCode records every important action: who did it, and when. This is the audit log.\n\n00:00:07.580 --> 00:00:11.134\nOpen Audit log. The newest activity is at the top.\n\n00:00:12.114 --> 00:00:18.146\nFilter by kind of activity. Here, Marks: every mark that was entered or changed.\n\n00:00:18.861 --> 00:00:22.983\nOr filter by person. These are the marks Mr. Amit Kumar entered.\n\n00:00:24.297 --> 00:00:28.779\nOpen an entry to see exactly what changed, before and after.\n\n00:00:30.027 --> 00:00:34.263\nApproval and publication are recorded too, with the reasons people gave.\n\n00:00:35.871 --> 00:00:42.664\nOnly the owner can export all of the school's data: in Settings, Your data, choose Export everything.\n\n00:00:44.340 --> 00:00:54.461\nThe export is a set of CSV files that open in Excel. Downloading it asks for the password again, and each export is deleted after seven days.\n\n00:00:56.791 --> 00:00:59.830\nNext, common problems and how to solve them.\n", "hi": "WEBVTT\n\n00:00:00.400 --> 00:00:06.837\nScoreCode हर ज़रूरी काम दर्ज करता है: किसने किया, और कब। इसे audit log कहते हैं।\n\n00:00:07.580 --> 00:00:11.403\nAudit log खोलें। सबसे नया काम सबसे ऊपर है।\n\n00:00:12.114 --> 00:00:17.538\nकाम के प्रकार से filter करें। यहाँ Marks: हर अंक जो भरा या बदला गया।\n\n00:00:18.861 --> 00:00:23.590\nया व्यक्ति से filter करें। ये वो अंक हैं जो श्री अमित कुमार ने भरे।\n\n00:00:24.297 --> 00:00:29.316\nकिसी entry को खोलकर देखें कि ठीक-ठीक क्या बदला, पहले और बाद में।\n\n00:00:30.027 --> 00:00:35.159\nApproval और publication भी दर्ज होते हैं, लोगों के दिए गए कारणों के साथ।\n\n00:00:35.871 --> 00:00:43.631\nस्कूल का पूरा data सिर्फ़ owner export कर सकते हैं: Settings में Your data खोलें, और Export everything चुनें।\n\n00:00:44.340 --> 00:00:56.085\nExport CSV files का एक सेट होता है जो Excel में खुलता है। Download करते समय password फिर से पूछा जाता है, और हर export सात दिन बाद मिट जाता है।\n\n00:00:56.791 --> 00:00:59.357\nआगे, आम समस्याएँ और उनके हल।\n"}}, {"id": "m14-troubleshooting", "title": {"en": "Module 14 · Common problems, and the whole year at a glance", "hi": "भाग 14 · आम समस्याएँ, और पूरा साल एक नज़र में"}, "role": "Everyone", "plan": "Every plan", "minutes": "1:17", "vtt": {"en": "WEBVTT\n\n00:00:00.400 --> 00:00:05.096\nHere are the problems schools meet most often, and what to do about each one.\n\n00:00:06.333 --> 00:00:14.910\nA wrong password. ScoreCode asks you to check your details. After several wrong attempts, the account is locked for a few minutes.\n\n00:00:15.706 --> 00:00:25.383\nForgot password sends a reset link by email. It only works if the person has an email address on record, so add students' emails where you can.\n\n00:00:27.065 --> 00:00:36.841\nAn activation code that does not match. Check the enrollment number and the code on the slip. If the slip is lost, an administrator can replace the code.\n\n00:00:37.874 --> 00:00:45.557\nA teacher sees nothing to mark. Papers appear only while marks entry is open, and only for the papers assigned to them.\n\n00:00:47.165 --> 00:00:55.974\nIf the school reaches a plan limit, such as the number of students, ScoreCode says so on the page, and Plan and usage shows the numbers.\n\n00:00:58.598 --> 00:01:07.860\nThe whole year, in order: structure, grading, students, staff, the exam, marks, then process, approve and publish.\n\n00:01:08.571 --> 00:01:13.200\nThat is the complete ScoreCode workflow for a school. Thank you for watching.\n", "hi": "WEBVTT\n\n00:00:00.400 --> 00:00:05.559\nये वो समस्याएँ हैं जो स्कूलों को सबसे ज़्यादा आती हैं, और हर एक का हल।\n\n00:00:06.333 --> 00:00:15.000\nगलत password। ScoreCode details जाँचने को कहता है। कई बार गलत होने पर account कुछ मिनट के लिए lock हो जाता है।\n\n00:00:15.706 --> 00:00:26.349\nForgot password ईमेल से reset link भेजता है। यह तभी काम करता है जब उस व्यक्ति का email दर्ज हो, इसलिए जहाँ हो सके छात्रों के email जोड़ें।\n\n00:00:27.065 --> 00:00:37.166\nActivation code मेल नहीं खाता। Slip पर लिखी enrollment number और code जाँचें। Slip खो जाए, तो administrator नया code दे सकते हैं।\n\n00:00:37.874 --> 00:00:46.460\nशिक्षक को अंक भरने के लिए कुछ नहीं दिखता। Paper तभी दिखते हैं जब marks entry खुली हो, और सिर्फ़ वही जो उन्हें दिए गए हों।\n\n00:00:47.165 --> 00:00:57.881\nअगर स्कूल plan की किसी सीमा तक पहुँच जाए, जैसे छात्रों की संख्या, तो ScoreCode उसी पेज पर बताता है, और Plan & usage में संख्या दिखती है।\n\n00:00:58.598 --> 00:01:07.317\nपूरा साल, क्रम से: structure, grading, छात्र, staff, परीक्षा, अंक, फिर process, approve और publish।\n\n00:01:08.571 --> 00:01:13.904\nयह एक स्कूल के लिए ScoreCode का पूरा तरीका है। देखने के लिए धन्यवाद।\n"}}];
const UI = {en:{heading:"ScoreCode · School training",lang:"Language",role:"Who: ",plan:"Plan: "},
            hi:{heading:"ScoreCode · स्कूल प्रशिक्षण",lang:"भाषा",role:"किसके लिए: ",plan:"Plan: "}};
const video = document.getElementById("video"), list = document.getElementById("list"), langSel = document.getElementById("lang");
let lang = "en", current = 0;
try { lang = localStorage.getItem("sc-training-lang") || "en"; } catch (e) {}
langSel.value = lang;
const vttUrl = (text) => URL.createObjectURL(new Blob([text], {type: "text/vtt"}));
function load(i, keepTime) {
  const m = MODULES[i], t = keepTime ? video.currentTime : 0, playing = keepTime && !video.paused;
  current = i;
  video.querySelectorAll("track").forEach((x) => x.remove());
  video.src = `../RENDERED/${lang}/${m.id}.mp4`;
  const tr = document.createElement("track");
  Object.assign(tr, {kind: "subtitles", srclang: lang, label: lang === "hi" ? "हिंदी" : "English", src: vttUrl(m.vtt[lang]), default: true});
  video.appendChild(tr);
  video.addEventListener("loadedmetadata", () => {
    video.textTracks[0].mode = "showing";
    if (t) video.currentTime = t;
    if (playing) video.play();
  }, {once: true});
  document.getElementById("title").textContent = m.title[lang];
  document.getElementById("role").textContent = UI[lang].role + m.role;
  document.getElementById("plan").textContent = UI[lang].plan + m.plan;
  render();
}
function render() {
  document.documentElement.lang = lang;
  document.getElementById("heading").textContent = UI[lang].heading;
  document.getElementById("lang-label").textContent = UI[lang].lang;
  list.replaceChildren(...MODULES.map((m, i) => {
    const li = document.createElement("li"), b = document.createElement("button");
    b.className = "item"; b.setAttribute("aria-current", String(i === current));
    b.innerHTML = "<b></b><span></span>";
    b.querySelector("b").textContent = m.title[lang];
    b.querySelector("span").textContent = m.minutes;
    b.onclick = () => { load(i, false); video.play(); };
    li.appendChild(b); return li;
  }));
}
langSel.onchange = () => { lang = langSel.value; try { localStorage.setItem("sc-training-lang", lang); } catch (e) {} load(current, true); };
video.addEventListener("ended", () => { if (current + 1 < MODULES.length) { load(current + 1, false); video.play(); } });
load(0, false);
</script>
